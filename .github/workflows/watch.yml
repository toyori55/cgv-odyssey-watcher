name: CGV 예매일 감시

on:
  schedule:
    # GitHub 예약 실행은 우선순위가 낮아 몇 시간씩 밀리거나 통째로 건너뛴다.
    # 그래서 크론은 "감시를 이어붙이는 방아쇠"로만 쓰고,
    # 실제 감시는 잡 하나가 340분(약 5시간 40분) 동안 1분 간격 루프로 수행한다.
    # 아래 concurrency 설정이 잡을 한 번에 하나만 돌리고 다음 잡을 대기시키므로,
    # 크론이 밀려도 잡이 끝나는 즉시 대기 중이던 잡이 이어받아 감시가 끊기지 않는다.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # 버튼으로 수동 실행
    inputs:
      test_alert:
        description: "알림 모양 테스트 (실제 감시 대신 샘플 알림 1건만 보냄)"
        type: boolean
        default: false
      diagnose:
        description: "텔레그램 진단 (메시지를 보내지 않고 봇/채팅 상태만 조회)"
        type: boolean
        default: false

# 감시 잡은 항상 1개만 실행하고, 새로 트리거된 잡은 취소하지 않고 대기시킨다.
# 테스트 실행은 별도 그룹이라 감시 잡을 기다리지 않고 바로 돈다.
concurrency:
  group: cgv-watch-${{ (inputs.test_alert || inputs.diagnose) && 'test' || 'main' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 직전 잡이 남긴 "이미 알고 있는 날짜" 목록을 가져온다.
      - name: 이전 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: cgv-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cgv-state-

      - name: 감시 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 감시할 극장들. "극장코드:표시이름" 을 쉼표로 나열한다.
          CGV_SITES: "0054:CGV 일산,0013:CGV 용산아이파크몰"
          CGV_MOV_NO: "30001166"
          CGV_MOV_NAME: "극장판 치이카와-인어 섬의 비밀"
          CGV_LOOP_INTERVAL: "60"
          CGV_LOOP_DURATION_MIN: "340"
          CGV_TEST_ALERT: ${{ inputs.test_alert && '1' || '0' }}
          CGV_DIAGNOSE: ${{ inputs.diagnose && '1' || '0' }}
          CGV_APP_OPEN_URL: ""
        run: python check.py

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cgv-state-${{ github.run_id }}-${{ github.run_attempt }}
